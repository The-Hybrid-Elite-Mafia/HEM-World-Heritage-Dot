name: Manual Windows MSVC build
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: manual-msvc-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    # Restricted to the explicitly authorized separate Dot repository.
    if: github.repository == 'The-Hybrid-Elite-Mafia/HEM-World-Heritage-Dot'
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify MSVC C++23, build and run silent tests
        shell: pwsh
        run: ./build-cloud.ps1
      - name: Preserve build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: whic-msvc-${{ github.sha }}
          path: |
            ci-output/logs/
            ci-output/delivery/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
